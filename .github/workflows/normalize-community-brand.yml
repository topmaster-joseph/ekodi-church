name: Normalize EKODI Community Brand

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/normalize-community-brand.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Normalize formal organization name and links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('EKODI선교회', '에코디커뮤니티').replace('에코디선교회', '에코디커뮤니티')

          # Only the former organization card is redirected to Community.
          pattern = r'(<article class="reveal c2">[\s\S]*?<h3>에코디커뮤니티</h3>[\s\S]*?<a href=")[^"]+(" target="_blank" rel="noreferrer">)[^<]+(</a>)'
          text, count = re.subn(pattern, r'\1https://community.ekodi.kr\2에코디커뮤니티 보기 →\3', text, count=1)
          if count != 1:
              raise SystemExit('Could not normalize Community card link')

          # Keep the public header intentionally compact. Social discovery belongs in
          # the online/social area, not as a permanent top-level header item.
          social = '<a data-ekodi-social="true" href="https://social.ekodi.kr/?org=church">Social</a>'
          text = text.replace(social, '')

          if 'EKODI선교회' in text or '에코디선교회' in text:
              raise SystemExit('Legacy formal organization name remains')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit normalized source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'EKODI Automation'
          git config user.email 'automation@ekodi.kr'
          git add index.html
          git commit -m 'Normalize Community brand and Church header'
          git push
