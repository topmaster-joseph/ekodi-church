name: EKODI Church Live Integration
on:
  pull_request:
    paths: ['index.html','church-live-embed.*','live/**','test-workspace/**','.github/workflows/church-live-test-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test-workspace/*.test.mjs
