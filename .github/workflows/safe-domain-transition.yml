name: Safe Domain Transition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safe-domain-transition.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Remove inactive canonical metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('  <link rel="canonical" href="https://church.ekodi.kr/">\n','')
          text=text.replace('  <meta property="og:url" content="https://church.ekodi.kr/">\n','')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep church canonical stable until DNS activation'
          git push
